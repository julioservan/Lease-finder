name: Escaneo diario de leases

on:
  schedule:
    # 3 veces al día: ~9 am, ~1 pm y ~5 pm hora de Nueva York (EDT)
    - cron: '0 13,17,21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests
        run: npm test

      - name: Instalar navegador headless (para fuentes con JavaScript)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Escanear fuentes
        id: scan
        run: |
          node scanner/watch.js --ci
          echo "has_news=$([ -f data/report.md ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Guardar estado actualizado
        run: |
          git config user.name "lease-scanner[bot]"
          git config user.email "actions@github.com"
          git add data/offers-latest.json data/scan-status.json data/price-history.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: actualizar estado del escáner de leases"
            # El escaneo tarda ~15 min; si mientras tanto entró otro commit,
            # el push directo se rechaza. Rebase + reintentos para no perder
            # los datos recién escaneados.
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "Push rechazado (intento $i); reintentando en $((i*5))s…"
              sleep $((i*5))
            done
            echo "No se pudo empujar tras 5 intentos." >&2
            exit 1
          else
            echo "Sin cambios en el estado."
          fi

      - name: Abrir issue con las novedades
        if: steps.scan.outputs.has_news == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('data/report.md', 'utf8');
            const date = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚗 Ofertas de lease — novedades ${date}`,
              body,
              labels: ['lease-scanner']
            });
