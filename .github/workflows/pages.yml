name: Publicar en GitHub Pages

on:
  push:
    branches: [claude/lease-offer-comparison-9ty6tq]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar sitio estático
        run: |
          mkdir -p _site/data
          cp -r index.html css js _site/
          cp data/offers-latest.json data/scan-status.json data/price-history.json _site/data/ 2>/dev/null || true

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          commit_message: 'Publicar Lease Finder en GitHub Pages'
